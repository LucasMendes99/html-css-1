<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Links</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
        }
        a {
            text-decoration: none;
            color: blue;
            font-weight: bold;
        }
        a:hover {
            color: black;
            text-decoration: underline;
        }
        a:visited {
            color: darkred;
        }
        a:active {
            color: yellow;
        }
        .especial {
            background-color: rgb(255, 154, 154);
        }
        .especial::before {
            content:"⇒";
            
        }
        .especial::after {
            content: "⇐";
        }
    </style>
</head>
<body>
    <h1>Personalizando Links </h1>
    <ul>
        <li><a href="https://gustavoguanabara.github.io">Repositorio Github</a></li>
        <li><a href="https://youtube.com/cursoemvideo/" class="especial">Canal do YouTube</a></li>
        <li><a href="https://www.cursoemvideo.com"class="especial"> Site do CursoemVideo</a></li>
    </ul>
</body>
</html>
