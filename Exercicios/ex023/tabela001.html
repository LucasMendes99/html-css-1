<!DOCTYPE html>
<html lang=pt-br>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabelas</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
        }
        table {
            width: 400px;
            height: 400px;
            border-collapse: collapse;
            background-image: linear-gradient(to right, lightgray, white);
        }
        td {
            border: 1px solid black;
            padding: 8px;
            text-align: center;/* ALINHAMENTO HORIZONTAL DENTRO DA CÉLULA => LEFT, CENTER, RIGHT */
            vertical-align: middle; /* ALINHAMENTO VERTICAL DO TEXTO DENTRO DA CÉLULA => TOP, MIDDLE, BOTTOM */
        }
    </style>
</head>
<body>
    <h1> Minha primeira tabela</h1>
    <!-- HIERARQUIA DA TABELA (SIMPLES)
     TABLE = TABELA
        TR = TABLE ROW (LINHA DA TABELA)
            TH = TABLE HEADER (CABEÇALHO DA TABELA)
            TD = TABLE DATA (DADO DA TABELA) => HTML5 = TD NAO PRECISA FECHAR
    -->
    <table>
        <tr class="linha"><!--PRIMEIRA LINHA-->
            <td>A1</td>
            <td>B1</td>
            <td class="bloco">C1</td>
        </tr>
        <tr><!--SEGUNDA LINHA-->
            <td>A2</td>
            <td>B2</td>
            <td>C2</td>
        </tr>
        <tr><!--TERCEIRA LINHA-->
            <td>A3</td>
            <td>B3</td>
            <td>C3</td>
        </tr>
        <tr><!--QUARTA LINHA-->
            <td>A4</td>
            <td>B4</td>
            <td>C4</td>
        </tr>
    </table>
</body>
</html>
