<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estudos de iframe</title>
    <style>
        iframe {
            width: 400px;
            height: 400px;
            border: 3px solid #000;
        }
    </style>
</head>
<body>
    <!-- Comentário sobre o uso de iframe 
    Quadro em linha que permite incorporar outro site dentro da pagina atual,
    porem o site incorporado pode ter restrições de segurança que impeçam sua exibição 
    dentro de um iframe. Exemplo site do google que não permite ser carregado em iframes.
    -->
    <!-- Tamanho do iframe e altura 300x150 
    scrolling="no" desabilita a barra de rolagem (so no mac funciona) 
    frameborder="0" remove a borda do iframe
    -->

    <h1> testando o uso de um iframe</h1>
    <p>Acessando o site do 
        
        <iframe src="https://www.cursoemvideo.com" frameborder="0" height="500"
        scrolling="no">
            <a href="https://www.cursoemvideo.com">Curso em Video</a>
        </iframe>
        para aprender a programar
    </p>

        <p>O site do <iframe src="https://www.linkedin.com" frameborder="0"></iframe> 
            <a href="https://www.linkedin.com">LinkedIn</a>
            tambem e muito legal, porem nao abriu.</p>
</body>
</html>
