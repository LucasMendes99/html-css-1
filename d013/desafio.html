<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabelas</title>
    <style>
        table, th, td {
            font-family: Arial, Helvetica, sans-serif;
            border: 1px solid black;
            border-collapse: collapse;
            padding: 20px;
        }
        thead, tfoot {
            padding: 10px;
            background-color: rgb(96, 99, 102);
            color: white;
        }
        .carea {
            background-color: blue;
        }
    </style>
</head>
<body>
    <table>

        <!-- Colunas da tabela com estilos 
        colgroup = define um grupo de colunas para formatação 

        Mesclagem de células com rowspan e colspan
        rowspan = mescla células na vertical
        colspan = mescla células na horizontal
        -->

        <colgroup>
            <col class="carea">
            <col class="cdisciplina">
            <col class="cnota1">
            <col class="cnota2">
            <col class="cmedia">
        </colgroup>
        <thead>
                <tr>
                    <th rowspan="2">Area</th>
                    <th rowspan="2">Disciplina</th>
                    <th colspan="2">Notas</th>
                    <th rowspan="2">Media</th>
                </tr>
                <tr>
                    <th>Nota 1</th>
                    <th>Nota 2</th>
                </tr>
        </thead>
        <tbody>
            <tr>
                <th rowspan="4">Exatas</th>
                <td>Matemática</td>
                <td>8.0</td>
                <td>7.5</td>
                <td>7.75</td>
            </tr>
            <tr>
                <td>Humanas</td>
                <td>0.0</td>
                <td>9.0</td>
                <td>8.5</td>
            </tr>
            <tr>
                <td>Biológicas</td>
                <td>7.0</td>
                <td>8.0</td>
                <td>7.5</td>
            </tr>
            <tr>
                <td>Lingüísticas</td>
                <td>6.0</td>
                <td>9.0</td>
                <td>7.5</td>
            </tr>
        </tbody>
        <thead>
            <tr>
                <th colspan="4">Média Geral</th>
                <th>7.8125</th>
            </tr>
        </thead>
                    <tr>
                <th rowspan="4">Exatas</th>
                <td>Matemática</td>
                <td>8.0</td>
                <td>7.5</td>
                <td>7.75</td>
            </tr>
            <tr>
                <td>Humanas</td>
                <td>0.0</td>
                <td>9.0</td>
                <td>8.5</td>
            </tr>
            <tfoot>
            <tr>
                <th colspan="4">Média Geral</th>
                <th>7.8125</th>
            </tr>
        </tfoot>
    </table>


</body>
</html>
